services:
  postgres:
    image: postgres:16-alpine
    container_name: naxis-postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: naxis
      POSTGRES_USER: naxis
      POSTGRES_PASSWORD: naxis_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schemas/postgres:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naxis -d naxis"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - naxis-net

  redis:
    image: redis:7-alpine
    container_name: naxis-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - naxis-net

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    image: naxis-worker
    container_name: naxis-worker
    command: python -u -m worker.main
    env_file: config/.env
    environment:
      SERVICE_NAME: naxis-worker
      LOG_LEVEL: INFO
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q worker.main /proc/1/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    restart: unless-stopped
    networks:
      - naxis-net
    deploy:
      resources:
        limits:
          memory: 1G

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    image: naxis-api
    container_name: naxis-api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    env_file: config/.env
    environment:
      SERVICE_NAME: naxis-api
      LOG_LEVEL: INFO
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - naxis-net
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: naxis-web
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-8000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - naxis-net
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  postgres_data:
    name: naxis_postgres_data
  redis_data:
    name: naxis_redis_data

networks:
  naxis-net:
    name: naxis-net
    driver: bridge
