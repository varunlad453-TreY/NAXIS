# Development overrides for hot-reload and debugging
services:
  worker:
    dns:
      - 8.8.8.8
      - 1.1.1.1
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    volumes:
      - ./backend/shared:/app/shared:ro
      - ./backend/worker:/app/worker:ro
      - ./backend/api:/app/api:ro
      - ./backend/config:/app/config:ro
    environment:
      LOG_LEVEL: DEBUG
      PYTHONUNBUFFERED: "1"
    command: python -u -m worker.main

  api:
    dns:
      - 8.8.8.8
      - 1.1.1.1
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    image: naxis-api
    volumes:
      - ./backend/shared:/app/shared:ro
      - ./backend/api:/app/api:ro
      - ./backend/worker:/app/worker:ro
      - ./backend/main.py:/app/main.py:ro
      - ./backend/config:/app/config:ro
    environment:
      LOG_LEVEL: DEBUG
      PYTHONUNBUFFERED: "1"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app

  web:
    dns:
      - 8.8.8.8
      - 1.1.1.1
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_KEY: ${API_KEY:-}

  # Adminer for browsing Postgres
  adminer:
    image: adminer:latest
    container_name: naxis-adminer
    ports:
      # Loopback-only: Adminer is an unauthenticated gateway to Postgres.
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - naxis-net
